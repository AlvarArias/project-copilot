name: Nightly Maintenance

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC todos los días
  workflow_dispatch: {}    # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read           # súbelo a "write" solo si vas a dejar que haga commit

jobs:
  nightly-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # corta el job si algo se queda colgado
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Correr Claude Code (orquestador + subagentes)
        # Pinned to a commit SHA on `main`, not a tag: the latest published tag
        # (v0.0.63) bundles Claude Code CLI 1.0.88, which is incompatible with
        # OAuth tokens from `claude setup-token` on current CLI versions and
        # fails with "API Error: Header '14' has invalid value". `main` installs
        # CLI 2.1.224 and is what actually works with a Pro OAuth token.
        uses: anthropics/claude-code-base-action@0d872d2732a6437c1cf868d7d8c9d0b8850496b6
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}  # generado con `claude setup-token`
          show_full_output: "true"   # TEMP: para diagnosticar el error is_error:true, revertir después
          claude_args: |
            --allowedTools "Read,Edit,Bash(npm test),Bash(npm audit),Bash(git log),Bash(git diff)" --model claude-sonnet-5 --max-turns 15
          prompt: |
            Eres el orquestador del mantenimiento nocturno de este repositorio.

            Haz lo siguiente en orden:
            1. Usa el subagente test-runner para correr y, si es seguro, arreglar los tests.
            2. Usa el subagente dep-auditor para revisar dependencias y aplicar
               actualizaciones seguras.
            3. Usa el subagente doc-updater para poner al día el README y comentarios
               si hubo cambios relevantes.
            4. Escribe un resumen final en nightly-summary.md con:
               - qué se arregló automáticamente
               - qué quedó pendiente y requiere revisión humana
               - si hay algo urgente, empieza el resumen con '⚠️ URGENTE:'

            No hagas commit ni push de nada — deja los cambios en el working
            directory para que se suban como artifact.

      - name: Subir resumen como artifact
        if: always()          # sube el resumen aunque el paso anterior falle a medias
        uses: actions/upload-artifact@v4
        with:
          name: nightly-summary-${{ github.run_id }}
          path: nightly-summary.md
          retention-days: 14
